<!DOCTYPE html>
<html>

<head>
  <title>Markerless AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js (Location + Markerless support) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- Camera -->
  <a-camera position="0 0 0"></a-camera>

  <!-- Invisible ground to detect clicks -->
  <a-plane id="ground"
           rotation="-90 0 0"
           width="10"
           height="10"
           color="#ffffff"
           opacity="0">
  </a-plane>

  <!-- Model (initially hidden) -->
  <a-entity id="model"
            gltf-model="model1.glb"
            scale="0.05 0.05 0.05"
            visible="false">
  </a-entity>

</a-scene>

<script>
  const ground = document.querySelector('#ground');
  const model = document.querySelector('#model');

  ground.addEventListener('click', function (event) {
    const point = event.detail.intersection.point;

    model.setAttribute('position', point);
    model.setAttribute('visible', true);
  });
</script>

</body>
</html>
