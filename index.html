<!DOCTYPE html>
<html>
<head>
  <title>Markerless AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
<a-scene cursor="rayOrigin: mouse">
  <a-camera position="0 1.6 3"></a-camera>
  <a-light type="directional" intensity="1.5" position="1 3 2"></a-light>
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-plane id="ground" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
  <a-entity id="model" gltf-model="model1.glb" scale="0.01 0.01 0.01" visible="false"></a-entity>
</a-scene>
<script>
let model=document.querySelector("#model");
let ground=document.querySelector("#ground");
let placed=false;
ground.addEventListener("click",function(e){
if(placed)return;
model.setAttribute("visible",true);
model.setAttribute("position",{x:e.detail.intersection.point.x,y:e.detail.intersection.point.y+0.2,z:e.detail.intersection.point.z});
placed=true;
});
</script>
</body>
</html>
