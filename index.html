<!DOCTYPE html>
<html>

<head>
  <title>Markerless AR - Click to Place</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene cursor="rayOrigin: mouse">

  <!-- Camera -->
  <a-camera position="0 1.6 3"></a-camera>

  <!-- Lighting -->
  <a-light type="directional" intensity="1.5" position="1 3 2"></a-light>
  <a-light type="ambient" intensity="0.8"></a-light>

  <!-- Ground (click surface) -->
  <a-plane 
    id="ground"
    rotation="-90 0 0"
    width="10"
    height="10"
    color="#7BC8A4">
  </a-plane>

  <!-- 3D Model (hidden initially) -->
  <a-entity
    id="model"
    gltf-model="model1.glb"   
    scale="0.1 0.1 0.1"
    visible="false">
  </a-entity>

</a-scene>

<script>
let model = document.querySelector("#model");
let ground = document.querySelector("#ground");

// Optional: place only once
let placed = false;

ground.addEventListener("click", (e) => {

  // Remove this if you want multiple placements
  if (placed) return;

  // Show model
  model.setAttribute("visible", true);

  // Set position where user clicked
  model.setAttribute("position", {
    x: e.detail.intersection.point.x,
    y: e.detail.intersection.point.y + 0.5, // lift above ground
    z: e.detail.intersection.point.z
  });

  placed = true;
});
</script>

</body>
</html>
