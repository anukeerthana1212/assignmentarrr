<!DOCTYPE html>
<html>

<head>
  <title>Markerless AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- Camera with cursor (CENTER DOT) -->
  <a-camera>
    <a-cursor 
      color="white"
      fuse="false"
      raycaster="objects: .clickable">
    </a-cursor>
  </a-camera>

  <!-- Clickable Ground -->
  <a-plane
    class="clickable"
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#ffffff"
    opacity="0">
  </a-plane>

  <!-- Model (hidden initially) -->
  <a-entity
    id="model"
    gltf-model="model1.glb"
    scale="0.03 0.03 0.03"
    visible="false">
  </a-entity>

</a-scene>

<script>
  const model = document.querySelector('#model');
  const ground = document.querySelector('.clickable');

  ground.addEventListener('click', function (e) {
    const point = e.detail.intersection.point;

    model.setAttribute('position', point);
    model.setAttribute('visible', true);
  });
</script>

</body>
</html>
